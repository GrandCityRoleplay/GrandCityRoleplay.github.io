<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset GCRP Password</title>
  <link rel="stylesheet" href="Styles.css">
</head>

<body>

  <main class="login-page">
    <div class="login-card">

      <h1>Set New Password</h1>
      <p>Choose a new password for your GCRP account.</p>

      <form id="reset-form">

        <input
          id="password"
          type="password"
          placeholder="New password"
          minlength="8"
          required
        >

        <input
          id="confirm-password"
          type="password"
          placeholder="Confirm new password"
          minlength="8"
          required
        >

        <button type="submit">
          Update Password
        </button>

        <p id="reset-message"></p>

      </form>

    </div>
  </main>

  <script src="reset-password.js"></script>

</body>
</html>

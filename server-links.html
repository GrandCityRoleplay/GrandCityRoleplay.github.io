<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GCRP Server Links</title>

  <link rel="stylesheet" href="Styles.css">
</head>

<body>

  <header>
    <div class="logo">
      <h2>GRAND CITY</h2>
      <span>ROLEPLAY</span>
    </div>

    <a href="admin.html">← Back to Admin Panel</a>
  </header>

  <main style="max-width:1100px;margin:80px auto;padding:20px;">

    <p style="color:#00bfff;letter-spacing:4px;">
      GCRP MANAGEMENT
    </p>

    <h1>🔗 Server Links</h1>

    <p>
      Manage the official GCRP community and server links.
    </p>

    <div id="links-list">

      <p>Loading server links...</p>

    </div>

    <div style="
      margin-top:40px;
      padding:30px;
      border:1px solid rgba(0,191,255,.4);
      border-radius:18px;
    ">

      <h2>➕ Add / Update Link</h2>

      <input
        id="link-name"
        type="text"
        placeholder="Link name"
        style="
          width:100%;
          padding:14px;
          margin-top:15px;
          box-sizing:border-box;
        "
      >

      <input
        id="link-url"
        type="url"
        placeholder="https://discord.gg/..."
        style="
          width:100%;
          padding:14px;
          margin-top:15px;
          box-sizing:border-box;
        "
      >

      <button
        id="save-link"
        style="
          margin-top:20px;
          padding:14px 25px;
          border:none;
          border-radius:10px;
          cursor:pointer;
        "
      >
        💾 Save Link
      </button>

      <p id="links-message"></p>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="server-links.js"></script>

</body>
</html>

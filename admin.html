<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GCRP Admin Panel 👑</title>

  <link rel="stylesheet" href="Styles.css">
</head>

<body>

  <header>
    <div class="logo">
      <h2>GRAND CITY</h2>
      <span>ROLEPLAY</span>
    </div>

    <a href="index.html">← Back to Website</a>
  </header>


  <main style="max-width:1100px;margin:80px auto;padding:20px;">

    <p style="color:#00bfff;letter-spacing:4px;">
      GCRP MANAGEMENT
    </p>

    <h1>Admin Panel 👑</h1>

    <p id="welcome-message">
      Checking administrator access...
    </p>


    <!-- DASHBOARD STATS -->

    <div class="dashboard-stats">

      <div class="stat-card">
        <span>👥</span>
        <h2 id="staff-count">...</h2>
        <p>Active Staff</p>
      </div>

      <div class="stat-card">
        <span>📋</span>
        <h2 id="complaint-count">...</h2>
        <p>Total Complaints</p>
      </div>

      <div class="stat-card">
        <span>⏳</span>
        <h2 id="pending-count">...</h2>
        <p>Pending Complaints</p>
      </div>

      <div class="stat-card">
        <span>🔗</span>
        <h2 id="server-count">...</h2>
        <p>Server Links</p>
      </div>

    </div>


    <!-- ADMIN SECTIONS -->

    <div class="admin-grid">

      <button class="admin-card"
              onclick="location.href='complaints.html'">

        <span>📋</span>

        <h2>Complaints</h2>

        <p>
          View and manage player complaints.
        </p>

      </button>


      <button class="admin-card"
              onclick="location.href='staff-management.html'">

        <span>👥</span>

        <h2>Staff Management</h2>

        <p>
          Add, edit and manage GCRP staff members.
        </p>

      </button>


      <button class="admin-card"
              onclick="location.href='permissions.html'">

        <span>👑</span>

        <h2>Give Power</h2>

        <p>
          Promote staff and manage positions.
        </p>

      </button>


      <button class="admin-card"
              onclick="location.href='server-links.html'">

        <span>🔗</span>

        <h2>Server Links</h2>

        <p>
          Manage connected servers and links.
        </p>

      </button>

    </div>


    <!-- ACCESS STATUS -->

    <div class="owner-dashboard">

      <h2>👑 Management Access</h2>

      <p id="admin-status">
        Checking your access...
      </p>

    </div>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- GCRP CONFIG + DASHBOARD -->

  <script src="script.js"></script>
  <script src="admin-dashboard.js"></script>

</body>
</html>

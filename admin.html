<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GCRP Admin Panel 👑</title>

  <link rel="stylesheet" href="Styles.css">
</head>

<body>

  <header>
    <div class="logo">
      <h2>GRAND CITY</h2>
      <span>ROLEPLAY</span>
    </div>

    <a href="index.html">← Back to Website</a>
  </header>

  <main style="max-width:1100px;margin:80px auto;padding:20px;">

    <p style="color:#00bfff;letter-spacing:4px;">
      GCRP MANAGEMENT
    </p>

    <h1>Admin Panel 👑</h1>

    <p>
      Welcome to the Grand City Roleplay management dashboard.
    </p>

    <div class="admin-grid">

      <!-- COMPLAINTS -->
      <button class="admin-card"
              onclick="location.href='complaints.html'">
        <span>📋</span>
        <h2>Complaints</h2>
        <p>View and manage player complaints.</p>
      </button>


      <!-- STAFF MANAGEMENT -->
      <button class="admin-card"
              onclick="location.href='staff-management.html'">
        <span>👥</span>
        <h2>Staff Management</h2>
        <p>View and manage GCRP staff members.</p>
      </button>


      <!-- GIVE POWER -->
      <button class="admin-card"
              onclick="location.href='permissions.html'">
        <span>👑</span>
        <h2>Give Power</h2>
        <p>Promote staff and manage positions.</p>
      </button>


      <!-- ORGANISATIONS -->
      <button class="admin-card"
              onclick="location.href='organisations.html'">
        <span>🏢</span>
        <h2>Organisations</h2>
        <p>Manage GCRP organisations.</p>
      </button>


      <!-- SERVER LINKS -->
      <button class="admin-card"
              onclick="location.href='server-links.html'">
        <span>🔗</span>
        <h2>Server Links</h2>
        <p>Manage connected servers and links.</p>
      </button>

    </div>


    <div style="
      margin-top:40px;
      padding:30px;
      border:1px solid rgba(0,191,255,.5);
      border-radius:18px;
    ">

      <h2>👑 Owner Dashboard</h2>

      <p>
        You are authenticated as an authorized GCRP staff member.
      </p>

      <p id="admin-status">
        GCRP Owner access confirmed.
      </p>

    </div>

  </main>

  <script src="Script.js"></script>

</body>
</html>

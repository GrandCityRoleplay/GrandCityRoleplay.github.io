<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GCRP Give Power</title>

  <link rel="stylesheet" href="Styles.css">
</head>

<body>

  <header>
    <div class="logo">
      <h2>GRAND CITY</h2>
      <span>ROLEPLAY</span>
    </div>

    <a href="admin.html">← Back to Admin Panel</a>
  </header>


  <main style="max-width:1100px;margin:80px auto;padding:20px;">

    <p style="color:#00bfff;letter-spacing:4px;">
      GCRP MANAGEMENT
    </p>

    <h1>👑 Give Power</h1>

    <p>
      Manage staff positions and permissions.
    </p>


    <div style="
      margin-top:35px;
      padding:30px;
      border:1px solid rgba(0,191,255,.4);
      border-radius:18px;
    ">

      <h2>👤 Select Staff Member</h2>

      <select
        id="staff-select"
        style="
          width:100%;
          padding:14px;
          margin-top:15px;
          border-radius:10px;
        "
      >

        <option value="">
          Loading staff...
        </option>

      </select>


      <h2 style="margin-top:30px;">
        🛡️ Select New Position
      </h2>


      <select
        id="position-select"
        style="
          width:100%;
          padding:14px;
          margin-top:15px;
          border-radius:10px;
        "
      >

        <option value="">
          Select Position
        </option>

        <option value="Owner">
          Owner
        </option>

        <option value="Chief Administrator">
          Chief Administrator
        </option>

        <option value="Senior Administrator">
          Senior Administrator
        </option>

        <option value="Administrator">
          Administrator
        </option>

        <option value="Junior Administrator">
          Junior Administrator
        </option>

        <option value="Moderator">
          Moderator
        </option>

      </select>


      <button
        id="save-position"
        style="
          margin-top:25px;
          padding:14px 25px;
          border:none;
          border-radius:10px;
          cursor:pointer;
        "
      >
        👑 Change Position
      </button>


      <p
        id="permissions-message"
        style="margin-top:20px;"
      ></p>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin-protection.js"></script>

  <script src="permissions.js"></script>

</body>
</html>

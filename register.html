<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create GCRP Account</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>

  <main class="login-page">

    <div class="login-card">

      <h1>Create GCRP Account</h1>

      <p>
        Join Grand City Roleplay.
      </p>


      <form id="register-form">


        <input
          id="username"
          type="text"
          placeholder="Username"
          required
        >


        <input
          id="display-name"
          type="text"
          placeholder="Display Name"
          required
        >


        <input
          id="email"
          type="email"
          placeholder="Email"
          required
        >


        <input
          id="password"
          type="password"
          placeholder="Password"
          minlength="6"
          required
        >


        <button type="submit">

          🚀 Create Account

        </button>


        <p id="register-message"></p>


        <p>

          Already have an account?

          <a href="login.html">

            Login

          </a>

        </p>


      </form>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="register.js"></script>

</body>

</html>

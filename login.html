<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCRP Staff Login</title>
  <link rel="stylesheet" href="Styles.css">
</head>

<body>

  <main class="login-page">
    <div class="login-card">

      <h1>GCRP Staff Login</h1>
      <p>Sign in to access the staff area.</p>

      <form id="login-form">

        <input
          id="email"
          type="email"
          placeholder="Email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

        <p id="login-message"></p>
        <p>
  <a href="#" id="forgot-password">Forgot password?</a>
        </p>

      </form>

    </div>
  </main>

  <script src="login.js"></script>

</body>
  </html>
